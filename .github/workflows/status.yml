name: status

# Probes each free-tier provider every 2 hours and publishes the status page
# to GitHub Pages. Needs: Settings > Pages > Source set to "GitHub Actions".
# GitHub Models works with the built-in token. Other providers switch on when
# their secret exists: GROQ_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY.

on:
  schedule:
    - cron: "17 */2 * * *"   # minute 17 avoids the top-of-hour rush on Actions
  workflow_dispatch:          # "Run workflow" button for a manual probe

permissions:
  contents: write   # push probe history to the status-data branch
  issues: write     # open and close incident issues
  models: read      # lets GITHUB_TOKEN call GitHub Models (free, no secret needed)
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out probe history
        run: scripts/status-data.sh checkout "$RUNNER_TEMP/status-data"

      - name: Probe providers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m llmgate probe --config config.status.json --out "$RUNNER_TEMP/status-data/probes.jsonl"

      - name: Save probe history
        run: scripts/status-data.sh save "$RUNNER_TEMP/status-data"

      - name: Sync incident issues
        # an API hiccup here must not stop the page from updating
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m llmgate incidents-sync --data "$RUNNER_TEMP/status-data/probes.jsonl" \
            --repo "${{ github.repository }}" \
            --page-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Build status site
        run: |
          python -m llmgate status-page --data "$RUNNER_TEMP/status-data/probes.jsonl" --out-dir site \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
